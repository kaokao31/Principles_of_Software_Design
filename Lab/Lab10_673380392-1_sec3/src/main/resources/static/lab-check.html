<!doctype html><html lang="th"><meta charset="utf-8"><title>Lab 10 API verification</title>
<style>body{font:16px sans-serif;max-width:1050px;margin:40px auto;background:#f5f7fb;color:#15243b}button{padding:12px 25px;background:#194a87;color:white;border:0;border-radius:8px}article{background:white;padding:18px;margin:18px 0;border:1px solid #cbd5e1;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.ok{color:#157347}.bad{color:#b42318}</style>
<h1>Lab 10 · Product API</h1><p>นายกานดิทัต นามสุดตา · 673380392-1 · SEC 3</p>
<p>เรียก API จริงบน server นี้ ผลลัพธ์ด้านล่างใช้ถ่ายภาพประกอบรายงานได้</p><p>การทดสอบจะเพิ่มแล้วลบสินค้า browser-test และฝากเงินจำลอง 10.25 ต่อครั้ง</p>
<button id="run">Run checks</button><div id="results"></div><script>
const cases=[['GET','/products',null,200],['GET','/products/1',null,200],['GET','/products/category/Electronics',null,200],['GET','/products/1/price',null,200],['POST','/products',{id:'browser-test',name:'Keyboard',category:'Accessories',brand:'Demo',stock:10,price:1000,discountType:'MEMBER'},200],['DELETE','/products/browser-test',null,204],['GET','/products/browser-test',null,404],['GET','/client-demo/products/1/name',null,200],['GET','/client-demo/products/missing/name',null,200],['POST','/wallet/deposits',{amount:10.25},200],['GET','/wallet',null,200]];
document.querySelector('#run').onclick=async()=>{const button=document.querySelector('#run');button.disabled=true;const target=document.querySelector('#results');target.replaceChildren();try{for(const [method,path,body,expected] of cases){const a=document.createElement('article');const h=document.createElement('h2');h.textContent=method+' '+path;a.append(h);const pre=document.createElement('pre');a.append(pre);target.append(a);try{const res=await fetch(path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let content=await res.text();try{content=JSON.stringify(JSON.parse(content),null,2)}catch{}h.className=res.status===expected?'ok':'bad';pre.textContent='Actual HTTP '+res.status+' | Expected '+expected+' | '+new Date().toISOString()+'\n'+(body?'Request: '+JSON.stringify(body)+'\n':'')+'Response:\n'+(content||'(empty body)');}catch(e){pre.textContent=String(e);h.className='bad';}}}finally{button.disabled=false;}};
</script></html>
